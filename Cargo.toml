[package]
name = "bustd"
authors = ["Vinícius R. Miguel <vrmiguel99@gmail.com>"]
version = "0.1.1"
edition = "2018"
readme = "README.md"
repository = "https://github.com/vrmiguel/bustd"
description = "Lightweight process killer daemon for out-of-memory scenarios"
categories = ["command-line-utilities", "memory-management"]
license = "MIT"

[dependencies]
libc = "0.2"
cfg-if = "1.0"
memchr = "2.5"
# glob = { version = "0.3", optional = true }  # Disabled by default for size

[build-dependencies]
cc = "1.0"
libc = "0.2"

[dev-dependencies]
procfs = { version = "0.14", default-features = false }

[features]
# glob-ignore = ["glob"]  # Enable only if needed

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"  # Optimize for size (z) over speed (3) - better for cache on weak CPU
strip = true
panic = "abort"  # Smaller binary, no unwind tables
incremental = false
debug = false
overflow-checks = false